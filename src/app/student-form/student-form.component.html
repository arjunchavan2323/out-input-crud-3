<div class="card">
    <h1 class="text-center">{{isINEDITMODE ? 'update Student ' : 'Add student'}}</h1>
    <div class="card-body">
        <div class="form-group">
    <label for="fname">fname</label>
    <input type="text" class="form-control" #fname>
</div>



<div class="form-group">
    <label for="lname">lname</label>
    <input type="text" class="form-control" #lname>
</div>



<div class="form-group">
    <label for="email">email</label>
    <input type="text" class="form-control" #email>
</div>



<div class="form-group">
    <label for="contact">contact</label>
    <input type="text" class="form-control" #contact>
</div>



<div class="form-group">
    <label for="isactive">isactive</label>
    <select type="text" class="form-control" #isactive>
        <option value="true">Yes</option>
        <option value="false">No</option>
    </select>
</div>

<button *ngIf="!isINEDITMODE" mat-raised-button color="primary" (click)="onaddstudent()">add student</button>
<button *ngIf="isINEDITMODE" mat-raised-button color="accent" (click)="onupdate()"> update</button>
    </div>
</div>
